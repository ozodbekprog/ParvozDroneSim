<!doctype html><html lang="en"><meta charset="utf-8"><title>Parvoz phase and frame measurements</title>
<style>html,body{margin:0;background:#171b21;color:#eef0f3;font:14px system-ui}#view{width:1280px;height:720px}.hangar-stage{position:absolute;top:70px;left:0;width:950px;height:590px}nav{display:flex;gap:8px;padding:12px;flex-wrap:wrap}button,select{background:#333b45;color:white;padding:8px;border:1px solid #77818e}output{display:block;white-space:pre-wrap;padding:12px}#status{position:absolute;top:65px;left:12px;background:#111d;max-width:650px}</style>
