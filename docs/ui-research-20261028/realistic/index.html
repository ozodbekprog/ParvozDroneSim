<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>PARVOZ — варианты на публичном ангаре</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15191c;color:#eee;font:15px system-ui}header{height:64px;display:flex;align-items:center;gap:12px;padding:12px 22px}header span{margin-right:auto}button{font:inherit;padding:8px 18px;color:inherit;background:#242b31;border:1px solid #69717a;cursor:pointer}button[aria-pressed=true]{background:#eee;color:#111}button:focus-visible{outline:3px solid #8dbdff}main{position:relative;height:calc(100vh - 64px)}#frame{position:absolute;top:50%;left:50%;width:1920px;height:1080px;transform-origin:center}img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}body.capture header{display:none}body.capture main{height:100vh}body.source #overlay{visibility:hidden}
</style>
<header><span>Свежий публичный ангар · статические концепты, 28 октября</span><button data-option="1">1</button><button data-option="2">2</button><button data-option="3">3</button><button id="source">Исходный кадр</button></header><main><div id="frame"><img id="background" src="evidence/public-hangar-background.png" alt="Прямой снимок публичного ангара, без генерации и ретуши"><img id="overlay" src="generated/01.png" alt="Предложение интерфейса"></div></main>
<script type="module">
const params=new URLSearchParams(location.search),frame=document.querySelector('#frame'),overlay=document.querySelector('#overlay');document.body.classList.toggle('capture',params.get('capture')==='1');
function fit(){frame.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1920,(innerHeight-(document.body.classList.contains('capture')?0:64))/1080)})`;}
async function choose(option){document.body.dataset.ready='false';overlay.src=`generated/0${option}.png`;document.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.option===option)));params.set('option',option);history.replaceState(null,'',`?${params}`);await Promise.all([overlay.decode(),document.querySelector('#background').decode()]);document.body.dataset.ready='true';}
document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.option)));document.querySelector('#source').addEventListener('click',()=>document.body.classList.toggle('source'));addEventListener('resize',fit);addEventListener('keydown',e=>{if(/^[123]$/.test(e.key))choose(e.key)});fit();choose(/^[123]$/.test(params.get('option'))?params.get('option'):'1');
</script></html>
